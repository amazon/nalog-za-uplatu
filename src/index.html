<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nalozi za uplatu - Poreska Uprava</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AlpineJS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- QRCode.js for rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap');
        
        body {
            font-family: Arial, sans-serif;
        }
        
        .value-font {
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
        }
        
        .uplatnica {
            width: 190mm;
            height: 94mm;
            background: #ffffff;
            border: 2px solid #000 !important;
            box-sizing: border-box;
            padding: 0mm 10mm;
            margin-bottom: 8mm;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .field-input {
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            background: transparent;
            border: none;
            width: 100%;
            outline: none;
            padding: 0;
        }
        
        .field-input:focus {
            background: #f0f8ff;
        }
        
        .text-area .field-input {
            min-height: 30px;
            resize: none;
        }
        
        /* Print optimizations */
        @media print {
            @page {
                size: A4 portrait;
                margin: 5mm 0;
            }
            body { 
                background: none !important; 
                padding: 0 !important; 
            }
            .print-controls { 
                display: none !important; 
            }
            .page-container { 
                box-shadow: none !important; 
                padding-top: 0 !important;
                padding-bottom: 0 !important;
                margin: 0 !important; 
                width: 210mm !important;
                background: none !important;
            }
            .uplatnica { 
                page-break-inside: avoid; 
                margin-bottom: 1mm !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-200 p-5 flex flex-col items-center min-h-screen" x-data="paymentSlips()">

    <!-- Print Controls -->
    <div class="print-controls bg-white px-8 py-4 rounded-lg shadow-md mb-5 sticky top-5 z-50 flex items-center gap-4 print:hidden">
        <button @click="window.print()" class="bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 px-6 rounded transition-colors">
            Print Slips
        </button>
        <button @click="addSlip()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded transition-colors">
            Add payment slip
        </button>
        <button @click="shareSlips()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded transition-colors">
            Share
        </button>
        <div class="flex items-center gap-2 border-l pl-4">
            <label class="flex items-center cursor-pointer">
                <input type="checkbox" x-model="showIpsCode" class="mr-2 w-5 h-5">
                <span class="font-semibold text-gray-700">IPS code</span>
            </label>
        </div>
    </div>

    <!-- Page Container -->
    <div class="page-container bg-white py-[15mm] shadow-lg flex flex-col items-center" style="width: 210mm;">
        
        <template x-for="(slip, index) in slips" :key="index">
            <div class="uplatnica">
                <!-- Action buttons (hidden when printing) -->
                <div class="no-print absolute top-2 right-2 flex gap-2 z-10">
                    <button @click="copySlip(index)" 
                            class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-2 py-1 rounded transition-colors"
                            title="Copy slip">
                        Copy
                    </button>
                    <button @click="removeSlip(index)" 
                            class="bg-red-500 hover:bg-red-600 text-white text-xs px-2 py-1 rounded transition-colors"
                            title="Remove slip">
                        Remove
                    </button>
                </div>
                
                <div class="text-center font-bold text-base mt-[2mm] mb-[2mm] tracking-wide">НАЛОГ ЗА УПЛАТУ</div>
                
                <div class="flex justify-between gap-5 flex-grow">
                    <!-- Left Column -->
                    <div class="w-[45%] flex flex-col gap-3">
                        <div class="flex flex-col w-full">
                            <span class="text-[10px] text-gray-700 mb-0.5 leading-tight">уплатилац</span>
                            <div class="border border-black bg-white min-h-[40px] flex items-end p-1 pl-2 box-border">
                                <input type="text" x-model="slip.payer" class="field-input w-full" placeholder="Ime i prezime / Firma">
                            </div>
                        </div>
                        <div class="flex flex-col w-full">
                            <span class="text-[10px] text-gray-700 mb-0.5 leading-tight">сврха уплате</span>
                            <div class="border border-black bg-white min-h-[40px] flex items-end p-1 pl-2 box-border">
                                <input type="text" x-model="slip.purpose" class="field-input w-full" placeholder="Svrha uplate">
                            </div>
                        </div>
                        <div class="flex flex-col w-full">
                            <span class="text-[10px] text-gray-700 mb-0.5 leading-tight">прималац</span>
                            <div class="border border-black bg-white min-h-[40px] flex items-end p-1 pl-2 box-border">
                                <input type="text" x-model="slip.receiver" class="field-input w-full" placeholder="Primaoac">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Right Column -->
                    <div class="w-[55%] flex flex-col">
                        <div class="flex gap-2.5 w-full">
                            <div class="w-[15%] flex flex-col">
                                <span class="text-[10px] text-gray-700 mb-0.5 leading-tight">шифра<br>плаћања</span>
                                <div class="border border-black bg-white min-h-[28px] flex items-center justify-center p-0 px-1 box-border">
                                    <input type="text" x-model="slip.paymentCode" class="field-input text-center" placeholder="253">
                                </div>
                            </div>
                            <div class="w-[15%] flex flex-col">
                                <span class="text-[10px] text-gray-700 mb-0.5 leading-tight"><br>валута</span>
                                <div class="border border-black bg-white min-h-[28px] flex items-center justify-center p-0 px-1 box-border">
                                    <input type="text" x-model="slip.currency" class="field-input text-center" placeholder="дин.">
                                </div>
                            </div>
                            <div class="w-[70%] flex flex-col">
                                <span class="text-[10px] text-gray-700 mb-0.5 leading-tight"><br>износ</span>
                                <div class="border border-black bg-white min-h-[28px] flex items-center justify-end pr-2.5 box-border">
                                    <input type="text" x-model="slip.amount" class="field-input text-right" placeholder="= 0,00">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-2 flex flex-col w-full">
                            <span class="text-[10px] text-gray-700 mb-0.5 leading-tight">рачун примаоца</span>
                            <div class="border border-black bg-white min-h-[28px] flex items-center p-0 px-1 box-border">
                                <input type="text" x-model="slip.accountNumber" class="field-input w-full" placeholder="840-xxxxxxxx-xx">
                            </div>
                        </div>
                        
                        <div class="mt-2 flex flex-col w-full">
                            <span class="text-[10px] text-gray-700 mb-0.5 leading-tight">модел и позив на број (одобрење)</span>
                            <div class="flex gap-2.5 w-full">
                                <div class="w-[15%] border border-black bg-white min-h-[28px] flex items-center justify-center p-0 px-1 box-border">
                                    <input type="text" x-model="slip.model" class="field-input text-center" placeholder="97">
                                </div>
                                <div class="w-[85%] border border-black bg-white min-h-[28px] flex items-center p-0 px-1 box-border">
                                    <input type="text" x-model="slip.referenceNumber" class="field-input w-full" placeholder="Poziv na broj">
                                </div>
                            </div>
                        </div>
                        
                        <!-- IPS QR Code -->
                        <div class="mt-3 flex justify-end" x-show="showIpsCode">
                            <div x-html="generateQR(slip)" class="qr-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg text-white font-semibold hidden transition-opacity duration-300 z-50" style="opacity: 0;">
        <span id="toast-message"></span>
    </div>

    <script>
        function paymentSlips() {
            return {
                showIpsCode: false,
                slips: [
                    {
                        payer: '',
                        purpose: '',
                        receiver: '',
                        paymentCode: '253',
                        currency: 'дин.',
                        amount: '',
                        accountNumber: '',
                        model: '97',
                        referenceNumber: ''
                    },
                ],
                
                addSlip() {
                    this.slips.push({
                        payer: '',
                        purpose: '',
                        receiver: '',
                        paymentCode: '253',
                        currency: 'дин.',
                        amount: '',
                        accountNumber: '',
                        model: '97',
                        referenceNumber: ''
                    });
                },
                
                copySlip(index) {
                    const slipToCopy = JSON.parse(JSON.stringify(this.slips[index]));
                    this.slips.splice(index + 1, 0, slipToCopy);
                },
                
                removeSlip(index) {
                    if (this.slips.length > 1) {
                        this.slips.splice(index, 1);
                    } else {
                        alert('Cannot remove the last slip. At least one slip must remain.');
                    }
                },
                
                // Share functionality - Generate QR string for a slip
                generateQRString(slip) {
                    const transliterate = (text) => {
                        if (!text) return '';
                        const cyrToLat = {
                            'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'ђ': 'dj', 'е': 'e', 'ж': 'z', 'з': 'z',
                            'и': 'i', 'ј': 'j', 'к': 'k', 'л': 'l', 'љ': 'lj', 'м': 'm', 'н': 'n', 'њ': 'nj', 'о': 'o',
                            'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'ћ': 'c', 'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'c',
                            'ч': 'c', 'џ': 'dz', 'ш': 's',
                            'А': 'A', 'Б': 'B', 'В': 'V', 'Г': 'G', 'Д': 'D', 'Ђ': 'Dj', 'Е': 'E', 'Ж': 'Z', 'З': 'Z',
                            'И': 'I', 'Ј': 'J', 'К': 'K', 'Л': 'L', 'Љ': 'Lj', 'М': 'M', 'Н': 'N', 'Њ': 'Nj', 'О': 'O',
                            'П': 'P', 'Р': 'R', 'С': 'S', 'Т': 'T', 'Ћ': 'C', 'У': 'U', 'Ф': 'F', 'Х': 'H', 'Ц': 'C',
                            'Ч': 'C', 'Џ': 'Dz', 'Ш': 'S'
                        };
                        return text.split('').map(c => cyrToLat[c] || c).join('');
                    };
                    
                    let amount = slip.amount || '';
                    amount = amount.replace(/^=\s*/, '').replace(/\./g, '').replace(',', '.');
                    const amountNum = parseFloat(amount) || 0;
                    
                    let account = (slip.accountNumber || '').replace(/-/g, '');
                    if (account.length >= 2 && account.length < 18) {
                        account = account.substring(0, 2) + account.substring(2).padStart(16, '0');
                    }
                    
                    const fields = [
                        'K:PR',
                        'V:01',
                        'C:1',
                        'R:' + account,
                        'N:' + transliterate(slip.payer).substring(0, 30),
                        'I:RSD' + amountNum.toFixed(2).replace('.', ',')
                    ];
                    
                    if (slip.receiver) fields.push('P:' + transliterate(slip.receiver).substring(0, 35));
                    if (slip.paymentCode) fields.push('SF:' + slip.paymentCode.substring(0, 3));
                    if (slip.purpose) fields.push('S:' + transliterate(slip.purpose).substring(0, 35));
                    if (slip.referenceNumber) fields.push('RO:' + slip.model + slip.referenceNumber.substring(0, 20));
                    
                    return fields.join('|');
                },
                
                // Share functionality - Sparse encode slips data
                sparseEncodeSlips() {
                    const qrStrings = this.slips.map(slip => this.generateQRString(slip));
                    
                    // Parse QR strings into field arrays
                    const parseQR = (qr) => {
                        const fields = {};
                        qr.split('|').forEach(field => {
                            const [key, value] = field.split(':');
                            if (key && value !== undefined) fields[key] = value;
                        });
                        return fields;
                    };
                    
                    const parsed = qrStrings.map(parseQR);
                    const fieldOrder = ['K', 'V', 'C', 'R', 'N', 'I', 'P', 'SF', 'S', 'RO'];
                    
                    // Apply sparse encoding: replace duplicate values with empty string
                    const sparse = parsed.map((fields, index) => {
                        const prev = index > 0 ? parsed[index - 1] : null;
                        const sparseFields = [];
                        
                        fieldOrder.forEach(key => {
                            const value = fields[key] || '';
                            const prevValue = prev ? (prev[key] || '') : null;
                            // If same as previous, use empty string
                            const output = (prev !== null && value === prevValue) ? '' : value;
                            if (fields.hasOwnProperty(key) || output) {
                                sparseFields.push(key + ':' + output);
                            }
                        });
                        
                        return sparseFields.join('|');
                    });
                    
                    return sparse.join('\n');
                },
                
                // Share functionality - Base64 URL-safe encode
                base64UrlSafeEncode(str) {
                    // Convert string to base64
                    let base64;
                    try {
                        base64 = btoa(unescape(encodeURIComponent(str)));
                    } catch (e) {
                        // Fallback for Unicode
                        base64 = btoa(str);
                    }
                    // Make URL-safe: replace + with -, / with _, remove = padding
                    return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
                },
                
                // Share functionality - Main share handler
                async shareSlips() {
                    try {
                        // Generate sparse encoded data
                        const sparseData = this.sparseEncodeSlips();
                        
                        // Base64 URL-safe encode
                        const encoded = this.base64UrlSafeEncode(sparseData);
                        
                        // Construct URL with version prefix
                        const url = window.location.origin + '/s/v1/' + encoded;
                        
                        // Copy to clipboard
                        await navigator.clipboard.writeText(url);
                        
                        // Show success toast
                        this.showToast('URL copied to clipboard!', 'success');
                    } catch (error) {
                        console.error('Share failed:', error);
                        this.showToast('Failed to copy URL. Please try again.', 'error');
                    }
                },
                
                // Toast notification function
                showToast(message, type = 'success') {
                    const toast = document.getElementById('toast');
                    const toastMessage = document.getElementById('toast-message');
                    
                    if (!toast || !toastMessage) return;
                    
                    // Set message and style based on type
                    toastMessage.textContent = message;
                    toast.classList.remove('hidden', 'bg-green-600', 'bg-red-600');
                    toast.classList.add(type === 'success' ? 'bg-green-600' : 'bg-red-600');
                    
                    // Show toast
                    toast.style.opacity = '1';
                    
                    // Auto-hide after 3 seconds
                    setTimeout(() => {
                        toast.style.opacity = '0';
                        setTimeout(() => {
                            toast.classList.add('hidden');
                        }, 300);
                    }, 3000);
                },
                
                generateQR(slip) {
                    if (!this.showIpsCode) return '';
                    
                    // Transliterate Serbian Cyrillic to ASCII Latin
                    const transliterate = (text) => {
                        if (!text) return '';
                        const cyrToLat = {
                            'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'ђ': 'dj', 'е': 'e', 'ж': 'z', 'з': 'z',
                            'и': 'i', 'ј': 'j', 'к': 'k', 'л': 'l', 'љ': 'lj', 'м': 'm', 'н': 'n', 'њ': 'nj', 'о': 'o',
                            'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'ћ': 'c', 'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'c',
                            'ч': 'c', 'џ': 'dz', 'ш': 's',
                            'А': 'A', 'Б': 'B', 'В': 'V', 'Г': 'G', 'Д': 'D', 'Ђ': 'Dj', 'Е': 'E', 'Ж': 'Z', 'З': 'Z',
                            'И': 'I', 'Ј': 'J', 'К': 'K', 'Л': 'L', 'Љ': 'Lj', 'М': 'M', 'Н': 'N', 'Њ': 'Nj', 'О': 'O',
                            'П': 'P', 'Р': 'R', 'С': 'S', 'Т': 'T', 'Ћ': 'C', 'У': 'U', 'Ф': 'F', 'Х': 'H', 'Ц': 'C',
                            'Ч': 'C', 'Џ': 'Dz', 'Ш': 'S'
                        };
                        return text.split('').map(c => cyrToLat[c] || c).join('');
                    };
                    
                    try {
                        // Parse amount (remove = and spaces, convert comma to dot)
                        let amount = slip.amount || '';
                        amount = amount.replace(/^=\s*/, '').replace(/\./g, '').replace(',', '.');
                        const amountNum = parseFloat(amount) || 0;
                        
                        // Clean account number (remove dashes) and pad to 18 digits
                        let account = (slip.accountNumber || '').replace(/-/g, '');
                        if (account.length >= 2 && account.length < 18) {
                            account = account.substring(0, 2) + account.substring(2).padStart(16, '0');
                        }
                        
                        if (!account && amountNum <= 0) {
                            return '<div style="width: 70px; height: 70px; border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #999; text-align: center;">No account<br>or amount</div>';
                        }
                        if (!account) {
                            return '<div style="width: 70px; height: 70px; border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #999; text-align: center;">No account</div>';
                        }
                        if (amountNum <= 0) {
                            return '<div style="width: 70px; height: 70px; border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #999; text-align: center;">No amount</div>';
                        }
                        
                        // Build minimal IPS QR code string with transliterated text
                        const fields = [
                            'K:PR',
                            'V:01',
                            'C:1',
                            'R:' + account,
                            'N:' + transliterate(slip.payer).substring(0, 30),
                            'I:RSD' + amountNum.toFixed(2).replace('.', ',')
                        ];
                        
                        // Only add optional fields if they exist
                        if (slip.receiver) fields.push('P:' + transliterate(slip.receiver).substring(0, 35));
                        if (slip.paymentCode) fields.push('SF:' + slip.paymentCode.substring(0, 3));
                        if (slip.purpose) fields.push('S:' + transliterate(slip.purpose).substring(0, 35));
                        if (slip.referenceNumber) fields.push('RO:' + slip.model + slip.referenceNumber.substring(0, 20));
                        
                        const qrString = fields.join('|');
                        
                        // Create a unique ID for this QR code
                        const qrId = 'qr-' + Math.random().toString(36).substr(2, 9);
                        
                        // Return a placeholder that will be replaced after render
                        setTimeout(() => {
                            const container = document.getElementById(qrId);
                            if (container && window.QRCode) {
                                container.innerHTML = '';
                                new QRCode(container, {
                                    text: qrString,
                                    width: 135,
                                    height: 135,
                                    colorDark: '#000000',
                                    colorLight: '#ffffff',
                                    correctLevel: QRCode.CorrectLevel.M
                                });
                            }
                        }, 0);
                        
                        return '<div id="' + qrId + '" style="width: 135px; height: 135px;"></div>';
                    } catch (e) {
                        console.error('QR generation error:', e);
                        return '<div style="width: 70px; height: 70px; border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #999;">Error</div>';
                    }
                }
            };
        }
    </script>

</body>
</html>
